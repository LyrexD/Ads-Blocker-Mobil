<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with squircle shape -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#10b981" stroke-width="6" opacity="0.4" />
  
  <!-- Outer Shield -->
  <path d="M256 70 C336 120 410 130 410 130 C410 280 340 380 256 440 C172 380 102 280 102 130 C102 130 176 120 256 70 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)" opacity="0.9" />

  <!-- Inner Shield Cutout -->
  <path d="M256 105 C320 145 378 153 378 153 C378 270 322 350 256 405 C190 350 134 270 134 153 C134 153 192 145 256 105 Z" 
        fill="#090d16" />

  <!-- Lightning Bolt / DNS Switch Symbol -->
  <path d="M275 160 L185 275 L245 275 L225 360 L330 240 L270 240 Z" 
        fill="#10b981" />

  <!-- AdGuard Green Check Dot -->
  <circle cx="340" cy="340" r="42" fill="#10b981" />
  <path d="M324 340 L335 351 L358 328" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
</svg>
